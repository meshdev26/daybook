name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^(src/|tests/|fuzz/|vendor/|assets/|Cargo\.|schema\.sql|Makefile|rust-toolchain\.toml|build\.rs|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: Gate (fmt, clippy, test, audit, deny)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit & cargo-deny
        if: needs.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Run the project gate
        if: needs.changes.outputs.code == 'true'
        run: make test

  client-check:
    name: Client JS type check
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: assets/package-lock.json
      - name: Type-check and test client JS
        if: needs.changes.outputs.code == 'true'
        run: npm ci --prefix assets && npm run --prefix assets check && npm test --prefix assets

  linux-x64:
    name: Compile check (linux-x64)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - run: cargo check --all-targets
        if: needs.changes.outputs.code == 'true'

  windows-x64:
    name: Compile check (windows-x64)
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - run: cargo check --all-targets
        if: needs.changes.outputs.code == 'true'

  macos:
    name: Compile check (${{ matrix.target }})
    needs: changes
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        if: needs.changes.outputs.code == 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - run: cargo check --all-targets
        if: needs.changes.outputs.code == 'true'
