[package]
name = "daybook"
version = "0.4.3-alpha"
edition = "2024"
license = "MIT"

# ---- Compile-time capability registry (multibot foundation) ----
# A feature selects which product capabilities are compiled in. The default
# set registers the shop tree, the moderation floor and all seven scoped bot
# types, including `movie_bot`. Every existing shop path and dependency stays
# unchanged. All seven types are live, not notices:
#   shop_bot   - AI shop bot (payments, products, AI drafts) — existing default.
#   moderation - owner/seller/per-bot word policy floor — existing default
#                (the runtime floor in handlers/moderation.rs also compiles
#                unconditionally; the FEATURE is off in a no-default build).
#   service    - services/bookings command family on a dedicated bot type.
#   web_app    - dashboard setup links on a dedicated bot type.
#   reply_bot  - support-ticket reply family on a dedicated bot type.
#   movie_bot  - movie catalogue: product search, purchase and post-payment
#                delivery. No in-app playback is claimed.
#   file_share - Telegram file_id shares: upload by document caption, browse,
#                per-user grant and re-send by token. Not arbitrary hosting.
#   automation - keyword-triggered auto-reply rules with audit; not a general
#                rules engine.
#
# Feature-optionalization investigation (complete, verified — do not
# re-litigate without a gate-sanctioned change): these are still INERT
# MARKERS. `cargo tree --depth 1` for `default` and for
# `--no-default-features --features movie_bot` yield the SAME direct
# dependency set. No `[dependencies]` entry is optionalizable from a core
# systems perspective: every crate is referenced by at least one module that compiles
# for every feature set —
#   reqwest/serde/tokio/tracing/chrono/sha2/getrandom/cookie/bcrypt -> web/**,
#     api.rs, auth.rs, embed.rs, mcp/**, bots.rs, services/**;
#   grammers-client/grammers-session/aes-gcm/pbkdf2/zeroize/thiserror ->
#     identity/** (wired into WebState by web/identity.rs et al.);
#   async-trait -> ai/** + identity/**;  tower-http -> web/mod.rs;
#   toml -> config.rs + web/bots_*.rs;  rusqlite -> db.rs.
# The eight capability modules under handlers/capabilities are `Descriptor`
# constants plus the scoped command router: they pull no dependency beyond
# teloxide's prelude and shared handlers,
# already required by the dispatcher. There is thus no capability-only dep to
# mark `optional = true` / `dep:`-map, and no crate-root module in src/lib.rs
# is purely capability-specific. Prerequisite for real removal (server-side):
# gate the web/api/auth/embed, ai/crypto, identity and shop command-tree
# modules behind these features, then add `dep:` mappings here. Keeping deps
# non-optional preserves a byte-identical default build and a green
# movie-only build. Advisory pins (rusqlite 0.41, libsqlite3-sys 0.39.1 and
# the vendored-teloxide sqlx bump) are unchanged.
[features]
default = ["shop_bot", "moderation", "service", "web_app", "reply_bot", "file_share", "automation", "movie_bot"]
shop_bot = []
moderation = []
movie_bot = []
reply_bot = []
file_share = []
web_app = []
service = []
automation = []

# Smaller, self-contained release binaries for desktop distribution (.exe/.app/tar.gz).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Icon/version embedding for daybook.exe. Scoped to Windows hosts so
# other platforms never compile it (keeps mixed-toolchain clippy builds clean);
# release CI builds the Windows artifact on a Windows runner.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1.11"

# The vendored teloxide is IDENTICAL to crates.io 0.17.0 except for one
# removed docs-only dependency: aquamarine (a mermaid-diagram doc macro)
# pulls in proc-macro-error2, which is unmaintained (RUSTSEC-2026-0173) and
# denied by `cargo deny check` in the gate. Stripping it here keeps the
# whole unmaintained subtree out of the lock instead of ignoring the
# advisory. Rebase this fork on the next teloxide bump; the diff is one
# attribute in src/update_listeners/polling.rs plus this dependency.
#
# Second divergence from crates.io 0.17.0: `sqlx` is bumped 0.8.1 -> 0.9.1
# in vendor/teloxide/Cargo.toml. sqlx-sqlite 0.8.x pins libsqlite3-sys 0.30.x,
# which bundles SQLite < 3.54.0 (RUSTSEC-2026-0459 / CVE-2026-119375).
# sqlx-sqlite 0.9.1 relaxes the cap to <0.41, letting the graph resolve to
# libsqlite3-sys 0.39.x (patched SQLite 3.54.x). Upstream teloxide 0.17 still
# declares sqlx 0.8.1, so this bump must be re-applied on every rebase.
[patch.crates-io]
teloxide = { path = "vendor/teloxide" }

[dependencies]
teloxide = { version = "0.17", features = ["macros", "ctrlc_handler", "sqlite-storage-rustls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.41", features = ["bundled"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
cookie = "0.18"
sha2 = "0.10"
async-trait = "0.1"
bcrypt = "0.15"
getrandom = "0.4"
# Word list only; four-word codes need no mnemonic API.
bip39 = "2.2.2"

# ---- Personal-account MTProto identity (Phase 0a, user-identity design) ----
# Exact pins (`=`) per the ratified design: grammers' raw-TL surfaces are not
# semver-stable, so every bump is a deliberate act with a session re-pair
# (src/identity/session.rs refuses blobs written by a different grammers
# version). default-features = false drops grammers-client's `tokio/fs`
# convenience feature; for grammers-session it keeps the optional `libsql`
# dependency (SQLite-backed session storage, a large C-library build) OUT of
# the graph — we store the serialized SessionData as one AES-256-GCM blob
# instead. Verdict after integration (cargo tree -i libsql): libsql does NOT
# enter the dependency graph; only `serde`/`serde_with` are activated on
# grammers-session via the `serde` feature.
grammers-client = { version = "=0.11.0", default-features = false }
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
# Session-blob crypto: AES-256-GCM for the blob, PBKDF2-HMAC-SHA256 for
# passphrase stretching — audited RustCrypto crates rather than hand-rolled
# primitives. Our direct deps stay on the digest-0.10 line so the blob path
# shares the `sha2` 0.10 already in the tree. Note: `grammers-crypto`
# (grammers' own subtree) independently pulls the digest-0.11 / sha2-0.11
# line, so two sha2 versions DO coexist in the lock — that is grammers'
# cost, not the blob store's. `pbkdf2`'s default feature set includes its
# own `hmac` dependency, so no separate direct `hmac` dep is needed.
aes-gcm = "0.10"
pbkdf2 = "0.12"
# Wipe the derived AES key buffer from memory after each save/load.
zeroize = "1"