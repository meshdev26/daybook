[advisories]
# Pre-existing, unrelated to RUSTSEC-2026-0459. chrono is unmaintained with no
# fixed release ("No safe upgrade is available!"); it is pulled transitively by
# the patched vendored teloxide-core 0.13.0 as well as directly. cargo audit
# already treats it as an allowed warning. Revisit when teloxide drops chrono
# or a maintained replacement is adopted. Kept in lockstep with .cargo/audit.toml.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
